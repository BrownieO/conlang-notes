        <h1>Orthography</h1>
        <p>Word spacing is based on evenness:</p>
		<ul>
			<li>Words have an even number of values</li>
			<li>Even values (i.e. syllables) end their word</li>
			<li>So, graphic spaces are not needed</li>
		</ul>
