    <body>
		<h1>Alphabet</h1>
        <p>The alphabet of Veluil has 16 values. They encode consonants at odd positions and syllables at even ones.</p>
		<table><thead>
		  <tr>
			<th>Value</th>
			<th>Odd</th>
			<th>Even</th>
		  </tr></thead>
		<tbody>
		  <tr>
			<td>0</td>
			<td>m</td>
			<td>u</td>
		  </tr>
		  <tr>
			<td>1</td>
			<td>k͈</td>
			<td>um</td>
		  </tr>
		  <tr>
			<td>2</td>
			<td>n</td>
			<td>a</td>
		  </tr>
		  <tr>
			<td>3</td>
			<td>tɕ</td>
			<td>am</td>
		  </tr>
		  <tr>
			<td>4</td>
			<td>d</td>
			<td>ʌ</td>
		  </tr>
		  <tr>
			<td>5</td>
			<td>t</td>
			<td>ʌm</td>
		  </tr>
		  <tr>
			<td>6</td>
			<td>p͈</td>
			<td>i</td>
		  </tr>
		  <tr>
			<td>7</td>
			<td>t͡ʃ</td>
			<td>im</td>
		  </tr>
		  <tr>
			<td>8</td>
			<td>b</td>
			<td>o</td>
		  </tr>
		  <tr>
			<td>9</td>
			<td>p</td>
			<td>om</td>
		  </tr>
		  <tr>
			<td>A</td>
			<td>ɾ</td>
			<td>ɛ</td>
		  </tr>
		  <tr>
			<td>B</td>
			<td>t͈ɕ</td>
			<td>ɛm</td>
		  </tr>
		  <tr>
			<td>C</td>
			<td>g</td>
			<td>ɯ</td>
		  </tr>
		  <tr>
			<td>D</td>
			<td>k</td>
			<td>ɯm</td>
		  </tr>
		  <tr>
			<td>E</td>
			<td>t͈</td>
			<td>wʌ</td>
		  </tr>
		  <tr>
			<td>F</td>
			<td>s</td>
			<td>wɛ</td>
		  </tr>
		</tbody></table>
    </body>
</html>
